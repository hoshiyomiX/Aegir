# Aegir Performance Benchmark Workflow
# Runs hourly to measure and track performance metrics
# Results are displayed in the GitHub Actions workflow summary

name: Performance Benchmark

on:
  # Run every hour
  schedule:
    - cron: '0 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      thorough:
        description: 'Run thorough benchmark (more iterations)'
        required: false
        default: 'false'
        type: boolean

  # Run on push to main/refactor branches for testing
  push:
    branches:
      - main
      - refactor-modular
    paths:
      - 'src/**'
      - 'benchmark/**'
      - '.github/workflows/benchmark.yml'

env:
  NODE_VERSION: '20'

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create benchmark directory
        run: mkdir -p benchmark/results

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install || true
          fi

      - name: Run benchmarks
        id: benchmark
        run: |
          echo "::group::Running Performance Benchmarks"
          node benchmark/runner.js 2>&1 | tee benchmark/output.log
          echo "::endgroup::"
          
          # Extract the markdown summary
          awk '/GITHUB ACTIONS SUMMARY MARKDOWN/,0' benchmark/output.log > benchmark/summary.md
          
          # Set output for summary
          echo "benchmark_completed=true" >> $GITHUB_OUTPUT

      - name: Generate GitHub Summary
        if: always()
        run: |
          # Create the summary header
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🔍 Aegir Performance Benchmark Report

          EOF
          
          # Add run metadata
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Add benchmark results
          if [ -f benchmark/summary.md ]; then
            # Skip the separator line and get the actual content
            tail -n +4 benchmark/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmark/results.json
            benchmark/output.log
          retention-days: 30

      - name: Check benchmark thresholds
        id: check
        run: |
          # Parse results and check if any benchmarks failed
          if [ -f benchmark/results.json ]; then
            failed=$(node -e "
              const fs = require('fs');
              const results = JSON.parse(fs.readFileSync('benchmark/results.json', 'utf8'));
              const failed = results.results.filter(r => r.passed === false);
              console.log(failed.length);
            ")
            
            if [ "$failed" -gt 0 ]; then
              echo "::warning::$failed benchmark(s) exceeded performance thresholds"
              echo "threshold_passed=false" >> $GITHUB_OUTPUT
            else
              echo "✅ All benchmarks passed performance thresholds"
              echo "threshold_passed=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create issue on failure
        if: steps.check.outputs.threshold_passed == 'false' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('benchmark/results.json', 'utf8'));
            const failed = results.results.filter(r => r.passed === false);
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Performance Regression Detected - ${new Date().toISOString().split('T')[0]}`,
              labels: ['performance', 'automated'],
              body: `## Performance Benchmark Failure
            
            **Run ID:** ${context.runId}
            **Date:** ${new Date().toISOString()}
            
            ### Failed Benchmarks
            
            ${failed.map(f => `- **${f.name}**: ${f.details || 'Exceeded threshold'}`).join('\n')}
            
            ### Action Required
            
            1. Review the [benchmark workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            2. Identify the cause of the regression
            3. Submit a fix or update thresholds if expected
            
            ### Summary
            
            | Metric | Value |
            |--------|-------|
            | Total Benchmarks | ${results.summary.total} |
            | Passed | ${results.summary.passed} |
            | Failed | ${results.summary.failed} |
            `
            });
            
            console.log(`Created issue #${issue.data.number}`);

      - name: Comment on PR (if applicable)
        if: github.event_name == 'push' && github.event.head_commit.message != null
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('benchmark/results.json')) {
              const results = JSON.parse(fs.readFileSync('benchmark/results.json', 'utf8'));
              console.log('Benchmark completed:', results.summary);
            }

  # Trend analysis job - runs after benchmark
  trend-analysis:
    name: Analyze Performance Trends
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download previous results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: previous-results
          merge-multiple: false

      - name: Analyze trends
        run: |
          echo "## 📊 Performance Trend Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if we have previous results
          if [ -d "previous-results" ] && [ "$(ls -A previous-results 2>/dev/null)" ]; then
            echo "Historical data available for trend analysis" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Recent benchmark runs:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            ls -la previous-results/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          else
            echo "No historical data available yet. Future runs will show trends." >> $GITHUB_STEP_SUMMARY
          fi

  # Notification job for scheduled runs
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [benchmark, trend-analysis]
    if: always() && github.event_name == 'schedule'
    
    steps:
      - name: Get benchmark status
        id: status
        run: |
          echo "benchmark_status=${{ needs.benchmark.result }}" >> $GITHUB_OUTPUT

      - name: Status summary
        run: |
          echo "## 📬 Notification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Benchmark Status: ${{ needs.benchmark.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trend Analysis Status: ${{ needs.trend-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
