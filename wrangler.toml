name = "aegir"
main = "src/index.js"
compatibility_date = "2024-03-29"

# QW-1: KV Namespace binding — activates existing cache layer in cache.js
# To activate: run `wrangler kv:namespace create "KV_CACHE"`, then set the
# id below and uncomment. Without KV, the worker gracefully degrades to
# in-memory cache + Cache API (caches.default), sufficient on free tier.
# [[kv_namespaces]]
# binding = "KV_CACHE"
# id = "<YOUR_KV_NAMESPACE_ID>"

# QW-2: Cron Triggers — scheduled cache warming & maintenance
# Free tier: up to 5 triggers per account
[triggers]
cron = ["*/15 * * * *"]

[observability]
enabled = true
