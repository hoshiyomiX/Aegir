<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegir Config Generator v3.0</title>
    <meta name="description" content="Generate proxy configs with ease">
    <!-- CSS will be inlined here during build -->
    <style>{{CSS}}</style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🌊</span>
                <h1>Aegir</h1>
            </div>
            <span class="version">v3.0</span>
        </header>

        <!-- Main Card -->
        <main class="card">
            <!-- Step 1: Select Proxy -->
            <section class="step" id="step1">
                <div class="step-header">
                    <span class="step-number">1</span>
                    <h2>Select Proxy Server</h2>
                </div>
                
                <div class="form-group">
                    <label for="country-select">Country</label>
                    <div class="select-wrapper">
                        <select id="country-select">
                            <option value="">-- Loading countries... --</option>
                        </select>
                        <span class="select-arrow">▼</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="proxy-select">Proxy Server</label>
                    <div class="select-wrapper">
                        <select id="proxy-select" disabled>
                            <option value="">-- Select country first --</option>
                        </select>
                        <span class="select-arrow">▼</span>
                    </div>
                    <div class="proxy-info" id="proxy-info" style="display: none;">
                        <span class="proxy-badge" id="proxy-badge"></span>
                    </div>
                </div>
            </section>

            <!-- Step 2: Config Options -->
            <section class="step" id="step2">
                <div class="step-header">
                    <span class="step-number">2</span>
                    <h2>Config Options</h2>
                </div>

                <div class="form-group">
                    <label>Protocol</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="protocol" value="trojan" checked>
                            <span class="radio-custom"></span>
                            <span class="radio-label">Trojan</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="protocol" value="vmess">
                            <span class="radio-custom"></span>
                            <span class="radio-label">VMess</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="protocol" value="ss">
                            <span class="radio-custom"></span>
                            <span class="radio-label">Shadowsocks</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Port</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="port" value="443" checked>
                            <span class="radio-custom"></span>
                            <span class="radio-label">443 (TLS)</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="port" value="80">
                            <span class="radio-custom"></span>
                            <span class="radio-label">80 (Non-TLS)</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- Step 3: Bug Inject -->
            <section class="step" id="step3">
                <div class="step-header">
                    <span class="step-number">3</span>
                    <h2>Bug Inject (Optional)</h2>
                </div>

                <div class="form-group">
                    <label for="bug-host">Bug Host / SNI</label>
                    <input type="text" id="bug-host" placeholder="e.g., cdn.example.com or leave empty">
                    <p class="hint">Leave empty to use Worker hostname</p>
                </div>
            </section>

            <!-- Generate Button -->
            <button id="generate-btn" class="generate-btn" disabled>
                <span class="btn-icon">⚡</span>
                <span class="btn-text">Generate Config</span>
            </button>

            <!-- Error Message -->
            <div id="error-msg" class="error-msg"></div>
        </main>

        <!-- Result Section -->
        <section class="result-card" id="result-section" style="display: none;">
            <div class="result-header">
                <h3>Generated Config</h3>
                <div class="result-actions">
                    <button id="copy-btn" class="action-btn copy-btn">
                        <span class="btn-icon">📋</span>
                        Copy
                    </button>
                    <button id="open-btn" class="action-btn open-btn">
                        <span class="btn-icon">🔗</span>
                        Open URL
                    </button>
                </div>
            </div>
            <div class="result-content">
                <textarea id="config-output" readonly></textarea>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Made with 💙 by Aegir Team</p>
        </footer>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Loading proxies...</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- JavaScript will be inlined here during build -->
    <script>{{JS}}</script>
</body>
</html>
