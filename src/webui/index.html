<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegir Config Generator v3.0</title>
    <meta name="description" content="Generate proxy configs with ease">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>{{CSS}}</style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="material-icons-round logo-icon">waves</span>
                <h1>Aegir</h1>
            </div>
            <span class="version">v3.0</span>
        </header>

        <!-- Main Card -->
        <main class="card">
            <!-- Proxy Selection -->
            <section class="section">
                <h2 class="section-title">Proxy Server</h2>
                
                <div class="form-group">
                    <label class="form-label" for="country-select">Country</label>
                    <div class="select-wrapper">
                        <select id="country-select" class="form-select">
                            <option value="">-- Loading countries... --</option>
                        </select>
                        <span class="material-icons-round select-icon">expand_more</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="proxy-select">Proxy IP</label>
                    <div class="select-wrapper">
                        <select id="proxy-select" class="form-select" disabled>
                            <option value="">-- Select country first --</option>
                        </select>
                        <span class="material-icons-round select-icon">expand_more</span>
                    </div>
                </div>
            </section>

            <!-- Config Options -->
            <section class="section">
                <h2 class="section-title">Config Options</h2>

                <div class="form-group">
                    <label class="form-label">Protocol</label>
                    <div class="chip-group">
                        <label class="chip">
                            <input type="radio" name="protocol" value="vless" checked>
                            <span class="chip-text">VLESS</span>
                        </label>
                        <label class="chip">
                            <input type="radio" name="protocol" value="trojan">
                            <span class="chip-text">Trojan</span>
                        </label>
                        <label class="chip">
                            <input type="radio" name="protocol" value="vmess">
                            <span class="chip-text">VMess</span>
                        </label>
                        <label class="chip">
                            <input type="radio" name="protocol" value="ss">
                            <span class="chip-text">Shadowsocks</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Port</label>
                    <div class="chip-group">
                        <label class="chip">
                            <input type="radio" name="port" value="443" checked>
                            <span class="chip-text">443 (TLS)</span>
                        </label>
                        <label class="chip">
                            <input type="radio" name="port" value="80">
                            <span class="chip-text">80 (Non-TLS)</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Output Format</label>
                    <div class="chip-group format-group">
                        <label class="chip">
                            <input type="radio" name="format" value="raw" checked>
                            <span class="chip-text">Raw URI</span>
                        </label>
                        <label class="chip">
                            <input type="radio" name="format" value="v2ray">
                            <span class="chip-text">V2Ray</span>
                        </label>
                        <label class="chip">
                            <input type="radio" name="format" value="clash">
                            <span class="chip-text">Clash</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- Bug Inject -->
            <section class="section">
                <h2 class="section-title">Bug Inject</h2>

                <div class="form-group">
                    <label class="form-label" for="bug-host">Bug Host / SNI (Optional)</label>
                    <div class="input-wrapper">
                        <span class="material-icons-round input-icon">dns</span>
                        <input type="text" id="bug-host" class="form-input" placeholder="Leave empty to use Worker host">
                    </div>
                </div>

                <div class="form-group">
                    <div class="switch-row">
                        <label class="switch-label" for="reverse-sni">Reverse SNI</label>
                        <label class="switch">
                            <input type="checkbox" id="reverse-sni">
                            <span class="switch-track"></span>
                        </label>
                    </div>
                    <p class="form-hint">Swap Bug Host and Worker Host in config</p>
                </div>
            </section>

            <!-- Generate Button -->
            <button id="generate-btn" class="btn-primary" disabled>
                <span class="material-icons-round">bolt</span>
                <span>Generate Config</span>
            </button>

            <!-- Error Message -->
            <div id="error-msg" class="error-msg"></div>
        </main>

        <!-- Result Section -->
        <section class="result-card" id="result-section" style="display: none;">
            <div class="result-header">
                <h3>Generated Config</h3>
                <button id="copy-btn" class="btn-icon" title="Copy to clipboard">
                    <span class="material-icons-round">content_copy</span>
                </button>
            </div>
            <div class="result-content">
                <textarea id="config-output" readonly></textarea>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by Aegir</p>
        </footer>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p>Loading proxies...</p>
    </div>

    <!-- Snackbar -->
    <div id="snackbar" class="snackbar"></div>

    <!-- JavaScript will be inlined here during build -->
    <script>{{JS}}</script>
</body>
</html>
